<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.png" type="image/png">
    <title>PhanarAi - Sign In</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body class="auth-static-page">
    <div class="landing-static-bg" aria-hidden="true"></div>

    <nav class="navbar auth-navbar">
        <div class="nav-left">
            <span class="logo-font nav-logo" onclick="window.location.href='landing.html'" style="cursor: pointer;">PhanarAi</span>
        </div>
        <div class="nav-right" id="nav-right">
            <select class="glass-btn" id="lang-select">
                <option value="en">EN</option>
                <option value="tr">TR</option>
                <option value="ru">RU</option>
            </select>
        </div>
    </nav>

    <main class="center-content">
        <div class="auth-container glass-panel">
            <h2 class="logo-font auth-title" id="txt-auth-title">Sign in</h2>
            
            <div class="input-group">
                <label id="txt-email-label">Email Address</label>
                <input type="email" id="email-input" placeholder="mail@example.com">
            </div>
            
            <div class="input-group">
                <label id="txt-pass-label">Password</label>
                <input type="password" id="pass-input" placeholder="••••••••">
            </div>

            <p id="login-error-msg" class="auth-form-error" role="alert" aria-live="polite"></p>
            
            <button type="button" class="auth-submit" id="btn-submit-login">Sign in</button>
            
            <div class="auth-link">
                <span id="txt-no-account">Don't have an account?</span> 
                <a href="signup.html" id="link-signup">Sign up</a>
            </div>
        </div>
    </main>

    <script src="session.js"></script>
    <script src="main.js"></script>
    <script src="login.js"></script>
</body>
</html>
