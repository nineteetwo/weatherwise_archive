<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhanarAi - Your Weather Companion</title>
    <meta name="description" content="PhanarAi — AI-powered weather & wardrobe recommendations. Find out what to wear today.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
    <script>
        (function(){
            const h = new Date().getHours();
            let t = 'night';
            if(h>=6 && h<8) t='sunrise';
            else if(h>=8 && h<12) t='morning';
            else if(h>=12 && h<17) t='noon';
            else if(h>=17 && h<19) t='sunset';
            else if(h>=19 && h<22) t='evening';
            document.body.className = `time-${t} weather-clear`;
        })();
    </script>
    
    <div id="sky-gradient"></div>
    <div id="clouds-layer"></div>
    <div id="fog-layer"></div>
    <canvas id="weather-canvas"></canvas>
    <div id="lightning-layer"></div>

    <nav class="navbar">
        <div class="nav-left">
            <span class="logo-font nav-logo" onclick="window.location.href='index.html'" style="cursor: pointer;">PhanarAi</span>
        </div>
        <button class="hamburger-btn" id="hamburger-btn">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <div class="nav-right" id="nav-right">
            <select class="glass-btn" id="lang-select">
                <option value="en">EN</option>
                <option value="tr">TR</option>
                <option value="ru">RU</option>
            </select>
            <!-- Giriş yapılmamışsa gösterilir -->
            <button class="glass-btn login-btn" id="nav-login" onclick="window.location.href='login.html'">Sign in</button>
            <button class="glass-btn signup-btn" id="nav-signup" onclick="window.location.href='signup.html'">Sign up</button>
            <!-- Giriş yapılmışsa gösterilir -->
            <span class="glass-btn nav-user-name" id="nav-user" style="display:none;"></span>
            <button class="glass-btn signout-btn" id="nav-signout" style="display:none;" onclick="signOut()">Sign out</button>
        </div>
    </nav>

    <main class="center-content">
        <h1 class="logo-font main-logo">PhanarAi</h1>
        
        <div class="weather-widget">
            <span class="material-symbols-outlined" id="weather-icon">clear_night</span>
            <span id="location-text">Adana</span>
            <span class="dot-separator">•</span>
            <span id="time-text">--:--</span>
            <span class="dot-separator">•</span>
            <span id="temp-text">22°C</span>
        </div>
        
        <div class="search-container glass-panel">
            <input type="text" id="search-input" placeholder="How can I help you today?">
            <div class="search-actions">
                <span class="material-symbols-outlined icon-btn enter-btn">arrow_upward</span>
            </div>
        </div>

        <div id="ai-results" class="glass-panel" style="display: none; margin-top: 25px; padding: 20px; border-radius: 20px; width: 100%; max-width: 760px; text-align: left;">
            <h3 style="margin-bottom: 15px; font-weight: 600; font-size: 18px; border-bottom: 1px solid var(--ui-glass-border); padding-bottom: 10px;">🤖 AI Recommendation</h3>
            
            <div style="display: flex; flex-direction: column; gap: 10px; font-size: 16px;">
                <div style="display: flex; justify-content: space-between;">
                    <span>👔 Clothing:</span>
                    <strong id="ai-clothing">--</strong>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span>☂️ Umbrella:</span>
                    <strong id="ai-umbrella">--</strong>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span>⭐ Suitability Score:</span>
                    <strong id="ai-score">--/10</strong>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--ui-glass-border);">
                    <span>🚦 Final Decision:</span>
                    <strong id="ai-decision" style="padding: 4px 12px; border-radius: 12px; font-size: 14px;">--</strong>
                </div>
            </div>

            <div style="margin-top: 15px; padding: 12px 16px; border-radius: 14px; background: rgba(255,255,255,0.08); border: 1px solid var(--ui-glass-border); font-size: 15px; line-height: 1.6;">
                <span style="font-weight: 600;">💬 AI Advice:</span>
                <p id="ai-advice-text" style="margin: 6px 0 0; opacity: 0.9; font-style: italic;">--</p>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-links">
            <a href="#" id="txt-privacy">Privacy Policy</a>
            <a href="#" id="txt-cookie">Cookie Policy</a>
        </div>
        <div class="copyright">© 2026 Yandex Anadolu Hackathon Fenerbahce Team. All rights reserved.</div>
    </footer>

    <script src="weather.js"></script>
    <script src="auth_handler.js"></script>
    <script src="main.js"></script>
</body>
</html>
